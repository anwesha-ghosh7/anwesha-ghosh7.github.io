<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>personal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('theme');
        if (storedTheme !== 'light' && storedTheme !== 'dark') {
          storedTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = storedTheme;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    }());
  </script>
  <style>
    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px;
      font-family: "Courier New", monospace;
      font-size: 16px;
    }
    h1 {
      color: #ffc0cb;
      font-family: "Courier";
      font-size: 25px;
    }
    .blog-section {
      margin-top: 40px;
      padding: 20px;
      border-top: 1px solid #ccc;
    }
    .blog-post {
      margin-bottom: 30px;
    }
    .blog-post h2 {
      color: #333;
      font-size: 22px;
    }
    .blog-post p {
      color: #555;
      line-height: 1.6;
    }
    .art-section {
      margin-top: 40px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
    }
    .art-section h2 {
      margin: 0 0 10px;
      color: inherit;
      font-size: 22px;
    }
    .art-section-intro {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }
    .art-gallery {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      padding: 0 0 12px;
      scroll-snap-type: x proximity;
      scrollbar-width: thin;
    }
    .art-piece {
      flex: 0 0 28%;
      margin: 0;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      scroll-snap-align: start;
    }
    .art-piece img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: var(--accent);
    }
    .art-piece-placeholder {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--accent);
    }
    .art-piece figcaption {
      padding: 10px 2px 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
    /* Tablet styles */
    @media only screen and (max-width: 1024px) {
      body {
        padding: 0 30px;
      }
    }
    /* Mobile styles */
    @media (max-width: 600px) {
      body {
        padding: 0 20px;
      }
      h1 {
      font-size: 20px;
      }
    }
    </style>
